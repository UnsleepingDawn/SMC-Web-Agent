[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "smc-web-agent-server"
version = "0.1.0"
requires-python = ">= 3.12"
description = "Backend API for the SMCLab daily affairs web application"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "sqlalchemy>=2.0.39",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.15.1",
    "python-multipart>=0.0.31",
    "types-psycopg2>=2.9.21.20250318",
    "types-requests>=2.32.0.20250306",
    "sqlalchemy2-stubs>=0.0.2a38",
    "boto3>=1.37.33",
    "types-boto3>=1.37.33",
    "gunicorn>=23.0.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=44.0.0",
    "celery>=5.5.3",
    "redis>=5.2.0",
    "openpyxl>=3.1.5",
]

[tool.uv]
constraint-dependencies = [
    "pyasn1>=0.6.3",
    "urllib3>=2.7.0",
    "starlette>=1.3.1",
    "idna>=3.15",
]

[tool.mypy]
plugins = [
    "sqlalchemy.ext.mypy.plugin",
]
show_error_codes = true
strict = true
