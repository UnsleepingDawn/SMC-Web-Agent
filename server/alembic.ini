# A generic, single database configuration.

[alembic]
# path to migration scripts
# Use forward slashes (/) also on windows to provide an os agnostic path
script_location = migrations

# template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# an optional timezone name (e.g. UTC, EST5EDT, etc.) will be applied to the timestamp
timezone = UTC

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# version path separator
version_path_separator = os

sqlalchemy.url = postgresql://smc:smc@localhost:5432/smc

[post_write_hooks]

# Logging is configured by app/logging_config.py, which migrations/env.py calls
# in place of alembic's own fileConfig.
