[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "smc-web-agent-jobs"
version = "0.1.0"
requires-python = ">= 3.12"
description = "Celery workers that call the Feishu open platform for SMC-Web-Agent"
dependencies = [
    "celery[auth,librabbitmq,msgpack,redis]>=5.6.2",
    "requests>=2.33.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "flower>=2.0.1",
    "types-requests>=2.32.4.20250611",
    "celery-stubs>=0.1.3",
    "boto3>=1.34.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "psutil>=5.9.0",
    "psycopg2-binary>=2.9.10",
    "cryptography>=44.0.0",
    "types-psutil>=7.0.0.20250601",
    "pulp>=2.9.0",
]

[tool.uv]
constraint-dependencies = [
    "tornado>=6.5.7",
    "pyasn1>=0.6.3",
    "urllib3>=2.7.0",
    "starlette>=1.3.1",
    "idna>=3.15",
]
# celery[auth] and kombu[msgpack] exact-pin these; override to pull in security fixes
override-dependencies = [
    "cryptography>=48.0.1",
    "msgpack>=1.2.1",
]
